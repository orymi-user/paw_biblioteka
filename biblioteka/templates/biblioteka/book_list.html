{% extends "biblioteka/base.html" %}


{% block title %}
    Książki — Biblioteka
{% endblock %}


{% block content %}

    <section>
        <form
            class="search-form"
            method="get"
        >

            <div>
                <label for="query">
                    Tytuł:
                </label>

                <input
                    type="text"
                    id="query"
                    name="query"
                    value="{{ query }}"
                    placeholder="np. Solaris"
                >
            </div>

            <div>
                <label for="available">
                    Dostępność:
                </label>

                <select
                    id="available"
                    name="available"
                >
                    <option value="">
                        Wszystkie
                    </option>

                    <option
                        value="yes"
                        {% if available_filter == "yes" %}
                            selected
                        {% endif %}
                    >
                        Dostępne
                    </option>

                    <option
                        value="no"
                        {% if available_filter == "no" %}
                            selected
                        {% endif %}
                    >
                        Niedostępne
                    </option>
                </select>
            </div>

            <button type="submit">
                Szukaj
            </button>

            <a
                class="button-link"
                href="{% url 'book_list' %}"
            >
                Wyczyść
            </a>

        </form>
        <h2>Lista książek</h2>

        <div class="book-list">

            {% for book in books %}

            <article class="book-card">

                <h3>
                    {{ book.title }}
                </h3>

                <div class="book-info">

                    <p>
                        <strong>Autor:</strong>
                        {{ book.author }}
                    </p>

                    <p>
                        <strong>Rok:</strong>
                        {{ book.year }}
                    </p>

                </div>

                <a
                    class="button-link"
                    href="{% url 'book_detail' book.id %}"
                >
                    Szczegóły
                </a>

            </article>

            {% endfor %}

        </div>
    </section>

{% endblock %}
